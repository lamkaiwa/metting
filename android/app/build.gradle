plugins { id 'com.android.application' }

android {
    namespace 'hk.tongpin.app'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'hk.tongpin.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            storeFile rootProject.file('.private/tongpin-release.jks')
            storePassword System.getenv('TONGPIN_STORE_PASSWORD')
            keyAlias 'tongpin'
            keyPassword System.getenv('TONGPIN_STORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.browser:browser:1.9.0'
}
